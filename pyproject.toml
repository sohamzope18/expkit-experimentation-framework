[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expkit"
version = "0.1.0"
description = "Simulation-validated experimentation analysis library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.13,<2.0",
    "pandas>=2.2,<3.0",
    "statsmodels>=0.14,<0.15",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.37,<2.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "pre-commit>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/expkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
# NPY002 bans the legacy numpy.random global API; reproducibility of results/
# depends on every study using numpy.random.default_rng(seed) instead.

[tool.black]
line-length = 100
target-version = ["py311"]
